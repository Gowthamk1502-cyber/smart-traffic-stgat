seed: 42
device: auto
data:
  dataset_name: witgaw/METR-LA
  cache_dir: ./data/hf_cache
  graph_cache_path: ./data/cached_graph.npz
  output_dir: ./outputs
  batch_size: 16
  num_workers: 0
  corr_threshold: 0.7
  graph_top_k: 20
  refresh_graph_every: 2
model:
  num_nodes: 207
  input_steps: 12
  output_steps: 12
  input_dim: 3
  temporal_mode: tcn
  tcn_layers: 2
  lstm_hidden_dim: 64
  lstm_layers: 1
  gat_hidden_dim: 64
  num_blocks: 2
  spatial_heads: 4
  temporal_heads: 4
  max_neighbors: 12
  time_embedding_dim: 16
  output_dim: 12
  dropout: 0.15
training:
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip: 5.0
  huber_delta: 1.0
  congestion_quantile: 15
  congestion_weight: 1.5
  horizon_weight: 1.3
  lr_factor: 0.5
  lr_patience: 4
  mixed_precision: true
  validate_every: 2
  early_stopping_patience: 10
  log_every: 10
  checkpoint_path: ./outputs/best_full_stgat.pt
